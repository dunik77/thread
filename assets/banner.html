<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>thread banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#14110e;
    --text:#ede3d3;
    --dim:#a89a80;
    --faint:#6e6252;
    --brass:#c99a44;
    --brass-bright:#f0c163;
    --node-dim:#4a4034;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1280px;height:420px;overflow:hidden;}
  body{
    background:var(--ink);
    position:relative;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
  }

  .grid{
    position:absolute; inset:0;
    background-image:radial-gradient(circle, #241f19 1px, transparent 1px);
    background-size:16px 16px;
    opacity:0.6;
  }
  .glow{
    position:absolute; left:50%; top:180px;
    width:1000px; height:440px; transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center, rgba(201,154,68,0.14) 0%, rgba(201,154,68,0.045) 40%, transparent 70%);
  }

  svg.threads{position:absolute; inset:0; width:1280px; height:420px;}

  /* absolute placement so nothing collides with the thread geometry */
  h1{
    position:absolute; left:0; right:0; top:96px;
    text-align:center;
    font-family:'IBM Plex Serif',Georgia,serif;
    font-weight:700;
    font-size:136px;
    letter-spacing:0.05em;
    color:var(--text);
    line-height:1;
    text-shadow:0 2px 34px rgba(0,0,0,0.9), 0 0 70px rgba(201,154,68,0.12);
  }
  .tagline{
    position:absolute; left:0; right:0; top:282px;
    text-align:center;
    font-size:20px;
    color:var(--dim);
    letter-spacing:0.015em;
    /* a soft plate of the background so any thread behind stays behind */
    text-shadow:0 0 12px var(--ink), 0 0 22px var(--ink), 0 0 30px var(--ink);
  }
  .tagline b{color:var(--text); font-weight:500;}

  .footer{
    position:absolute; left:36px; right:36px; bottom:26px;
    display:flex; align-items:center; justify-content:space-between;
    font-size:11.5px; letter-spacing:0.09em; color:var(--faint);
    text-shadow:0 0 10px var(--ink), 0 0 18px var(--ink);
  }
  .legend{display:flex; align-items:center; gap:9px;}
  .legend .sw{width:9px;height:9px;background:var(--brass-bright);display:inline-block;}
  .legend .swd{width:9px;height:9px;background:var(--node-dim);display:inline-block;}
  .footer .on{color:var(--brass);}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <!--
    The thread runs left to right through a row of address nodes, weaving
    behind the wordmark, then doubles back to a node it already passed.
    That loop is the whole product in one line: the same actor turning up
    again, some launches later.
  -->
  <svg class="threads" viewBox="0 0 1280 420" fill="none">
    <path d="M -20 236 L 96 236 L 152 208 L 236 208 L 292 250 L 378 250 L 432 214 L 528 214
             L 582 254 L 676 254 L 730 210 L 820 210 L 874 248 L 968 248 L 1022 212 L 1112 212 L 1300 212"
          stroke="#4a4034" stroke-width="2" stroke-linejoin="round"/>

    <!-- the loop back, routed well clear of the tagline -->
    <path d="M 1022 212 C 1000 356, 760 392, 540 378 C 400 369, 330 320, 292 250"
          stroke="#c99a44" stroke-width="2.5" stroke-linejoin="round"/>

    <g fill="#4a4034">
      <rect x="90" y="230" width="12" height="12"/>
      <rect x="230" y="202" width="12" height="12"/>
      <rect x="372" y="244" width="12" height="12"/>
      <rect x="522" y="208" width="12" height="12"/>
      <rect x="670" y="248" width="12" height="12"/>
      <rect x="814" y="204" width="12" height="12"/>
      <rect x="962" y="242" width="12" height="12"/>
      <rect x="1106" y="206" width="12" height="12"/>
    </g>

    <!-- the two ends of the loop: one address, seen twice -->
    <g>
      <rect x="283" y="241" width="18" height="18" fill="#f0c163"/>
      <rect x="278" y="236" width="28" height="28" fill="none" stroke="#c99a44" stroke-width="1.5" opacity="0.5"/>
      <rect x="1013" y="203" width="18" height="18" fill="#f0c163"/>
      <rect x="1008" y="198" width="28" height="28" fill="none" stroke="#c99a44" stroke-width="1.5" opacity="0.5"/>
    </g>
  </svg>

  <h1>thread</h1>
  <div class="tagline">new wallets. <b>familiar connections.</b></div>

  <div class="footer">
    <span class="legend">
      <span class="swd"></span> an address
      <span style="width:16px"></span>
      <span class="sw"></span> the same one, seen again
    </span>
    <span>pons v2 &middot; <span class="on">robinhood chain 4663</span> &middot; evidence only, nothing scored</span>
  </div>
</body>
</html>
